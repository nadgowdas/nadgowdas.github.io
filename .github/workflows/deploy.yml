name: Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build website
        run: bundle exec jekyll build
      - name: Setup deploy options
        id: setup
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "src_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "no_push=--no-push" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy website
        env:
          SOURCE_BRANCH: ${{ steps.setup.outputs.src_branch }}
          NO_PUSH: ${{ steps.setup.outputs.no_push }}
        run: printf 'y\n' | bin/deploy --src "$SOURCE_BRANCH" --deploy gh-pages $NO_PUSH
