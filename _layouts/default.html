<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% if page.redirect %}<meta http-equiv="refresh" content="3; url={{ '/' | absolute_url }}" />{% endif %}
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="container site-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include scripts/misc.html %}
    {% include scripts/mathjax.html %}
    {% include scripts/analytics.html %}
  </body>
</html>
