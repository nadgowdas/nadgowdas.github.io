<article class="project-card">
  {% if project.redirect %}{% assign project_url = project.redirect %}{% else %}{% assign project_url = project.url | relative_url %}{% endif %}
  {% if project.img %}<a href="{{ project_url }}" tabindex="-1" aria-hidden="true"><img src="{{ project.thumbnail | default: project.img | relative_url }}" alt="" loading="lazy" width="640" height="400"></a>{% endif %}
  <div class="project-card-body"><h3><a href="{{ project_url }}">{{ project.title }}</a></h3><p>{{ project.description }}</p><a class="text-link" href="{{ project_url }}">Read about the project <span aria-hidden="true">↗</span></a>{% if project.github %}<a class="text-link" href="{{ project.github }}">Source code <span aria-hidden="true">↗</span></a>{% endif %}</div>
</article>
